<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00060E" />

    <!-- Primary SEO -->
    <title>QELVRA | Digital Products That Drive Results</title>
    <meta
      name="description"
      content="QELVRA designs and builds websites, web apps, SaaS platforms, dashboards and mobile apps, premium digital products that help businesses grow."
    />
    <meta
      name="keywords"
      content="web design, web development, SaaS platforms, dashboards, mobile apps, portfolio, QELVRA"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="QELVRA" />
    <link rel="canonical" href="https://qelvra.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QELVRA" />
    <meta property="og:url" content="https://qelvra.dev/" />
    <meta property="og:title" content="QELVRA | Digital Products That Drive Results" />
    <meta
      property="og:description"
      content="Websites, web apps, SaaS platforms, dashboards and mobile apps, premium digital products that help businesses grow."
    />
    <meta property="og:image" content="./assets/logos/qelvra-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QELVRA brand mark" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QELVRA | Digital Products That Drive Results" />
    <meta
      name="twitter:description"
      content="Websites, web apps, SaaS platforms, dashboards and mobile apps, premium digital products that help businesses grow."
    />
    <meta name="twitter:image" content="./assets/logos/qelvra-logo.png" />

    <!-- Structured data: WebSite + ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://qelvra.dev/#website",
            "url": "https://qelvra.dev/",
            "name": "QELVRA",
            "description": "Digital products that drive results: websites, web apps, SaaS platforms, dashboards and mobile apps.",
            "inLanguage": "en"
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://qelvra.dev/#organization",
            "name": "QELVRA",
            "url": "https://qelvra.dev/",
            "logo": "https://qelvra.dev/assets/logos/qelvra-logo.png",
            "description": "Design and development studio for websites, web apps, SaaS platforms, dashboards and mobile apps.",
            "areaServed": "Worldwide",
            "sameAs": [
              "https://linkedin.com",
              "https://twitter.com",
              "https://instagram.com",
              "https://facebook.com"
            ],
            "makesOffer": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design & Development" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SaaS Platform Engineering" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Dashboard & Analytics Builds" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile App Development" } }
            ]
          }
        ]
      }
    </script>

    <!-- Favicon & Brand Asset Mappings from /assets/favicons/ -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicons/favicon-16x16.png" />
    <link rel="shortcut icon" href="./assets/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="./assets/favicons/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

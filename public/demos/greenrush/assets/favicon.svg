      <stop offset="0%" stop-color="#76c828" />
      <stop offset="100%" stop-color="#467c19" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c" />
